name: CI code Quality and Security check

on:
  push:
    branches: 
      - '*-hotfix-**'
      - '*-fix-**'
      - '*-bugfix-**'
      - '*-feature-**'
      - '*-enhance-**'
      - '*-refactor-**'
      - '*-chore-**'
      - '*-test-**'
      - '*-ci-**'
      - '*-build-**'
      - '*-deps-**'
      - '*-style-**'
      - '*-docs-**'
      - '*-perf-**'
      - '*-i18n-**'
      - '*-revert-**'
      - '*-config-**'
      - '*-lint-**'

jobs:
  code_quality_check:
    name: "Code Quality Checks"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
       
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22
            
      - name: Install dependencies
        run: npm ci

      - name: Check Lint code
        run: npm run lint
        
      - name: Build project
        run: npm run build

  security_check:
    name: "Security Checks"
    runs-on: ubuntu-latest
    needs: code_quality_check

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
       
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Verify lockfile integrity
        run: npm ci --verify-tree

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,typescript

      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@v3
        with:
          autobuild: true